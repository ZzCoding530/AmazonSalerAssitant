syntax = "proto3";

package scheduler;

option go_package = "github.com/adgenie/scheduler/proto;schedulerpb";

// 调度层：任务调度、限流、重试。
// 服务端通过 HTTP 调用 Flask 服务层执行 DAG，并负责限流与重试。
service Scheduler {
  rpc SchedulePipeline(ScheduleRequest) returns (ScheduleResponse);
  rpc GetJobStatus(JobStatusRequest) returns (JobStatusResponse);
}

message ScheduleRequest {
  string listing_id = 1;
  string copy_text = 2;
  string profile_version = 3;
  string copy_version = 4;
  string rubric_version = 5;
  string knowledge_version = 6;
}

message ScheduleResponse {
  string job_id = 1;
  string status = 2;
}

message JobStatusRequest {
  string job_id = 1;
}

message JobStatusResponse {
  string job_id = 1;
  string status = 2;   // queued | running | done | failed
  string result = 3;   // 执行结果（JSON）
  int32 retries = 4;
}
